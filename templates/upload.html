{% extends "base.html" %}

{% block title %}Upload Receipt{% endblock %}

{% block content %}
<div class="upload-simple">
    <h1>📸 Upload Receipt</h1>
    <p>Snap a photo or pick an image from your phone.</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}

    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="image" class="upload-btn">
            📤 Select Image
            <input type="file" id="image" name="image" accept="image/*" capture="environment" required>
        </label>
        <button type="submit" class="submit-btn">🚀 Process</button>
    </form>
</div>

<style>
    .upload-simple {
        max-width: 500px;
        margin: 2rem auto;
        padding: 1rem;
        text-align: center;
    }

    .upload-simple h1 {
        font-size: 2rem;
        color: #1a2332;
        margin-bottom: 0.5rem;
    }

    .upload-simple p {
        color: #4a5568;
        margin-bottom: 1.5rem;
    }

    /* BIG BUTTON - like a real app */
    .upload-btn {
        display: block;
        background: #f0a830;
        color: #fff;
        font-size: 1.5rem;
        font-weight: 700;
        padding: 1.2rem 0;
        border-radius: 16px;
        cursor: pointer;
        text-align: center;
        transition: background 0.2s;
        box-shadow: 0 4px 12px rgba(240, 168, 48, 0.3);
        margin-bottom: 1rem;
    }

    .upload-btn:hover {
        background: #d99a2a;
    }

    .upload-btn input[type="file"] {
        display: none;
    }

    .submit-btn {
        width: 100%;
        background: #1a2332;
        color: #fff;
        font-size: 1.5rem;
        font-weight: 700;
        padding: 1.2rem 0;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .submit-btn:hover {
        background: #2d3748;
    }

    .flash {
        background: #fff5f5;
        color: #9b2c2c;
        border: 1px solid #feb2b2;
        padding: 0.8rem;
        border-radius: 8px;
        margin-bottom: 1rem;
    }

    /* Mobile friendly */
    @media (max-width: 480px) {
        .upload-simple h1 {
            font-size: 1.5rem;
        }
        .upload-btn, .submit-btn {
            font-size: 1.2rem;
            padding: 1rem 0;
            border-radius: 14px;
        }
    }
</style>
{% endblock %}
