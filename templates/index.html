<!DOCTYPE html>
<html>
<head>
    <title>Receipt AI</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .upload-box { border: 2px dashed #ccc; padding: 2rem; text-align: center; }
        input[type="file"] { margin: 1rem 0; }
        button { background: #007bff; color: white; border: none; padding: 0.5rem 2rem; font-size: 1rem; cursor: pointer; }
        .flash { color: red; }
    </style>
</head>
<body>
    <h1>📄 Receipt AI</h1>
    <p>Upload a receipt image and let AI extract the data.</p>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}
    <form action="/upload" method="post" enctype="multipart/form-data" class="upload-box">
        <p>Choose an image (PNG, JPG, JPEG, GIF)</p>
        <input type="file" name="image" accept="image/*" required>
        <br><br>
        <button type="submit">Upload & Process</button>
    </form>
</body>
</html>
