{% extends "base.html" %}

{% block content %}
<!-- Full‑screen wrapper for the Money Mirror background -->
<div class="mirror-login-wrapper">
    
    <!-- Floating ambient orbs for that "snapshot / reflection" energy -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="auth-container modern-auth glass-card">
        <h1>👀 Your financial mirror</h1>
        <p class="subtitle">Snapshots of your life. No spreadsheets. Just clarity.</p>

        <form id="login-form" autocomplete="off">
            <!-- Email -->
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required autofocus>
            </div>

            <!-- Password with toggle -->
            <div class="input-group password-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" id="toggle-password" aria-label="Show password">
                        👁️
                    </button>
                </div>
            </div>

            <!-- Remember me & Forgot link -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember" checked> Remember me
                </label>
                <a href="/forgot-password" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Submit button with spinner -->
            <button type="submit" id="login-btn">
                <span class="btn-text">See where I’m at →</span>
                <span class="spinner-btn" style="display:none;">⏳</span>
            </button>

            <!-- Message area -->
            <div id="msg" class="msg"></div>
        </form>

        <div class="auth-footer">
            New here? <a href="/register">Get your first snapshot.</a>
        </div>
    </div>
</div>
{% endblock %}
