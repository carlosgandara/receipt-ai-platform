# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/migrations

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# prepend sys.path
prepend_sys_path = .

# timezone (leave blank for localtime)
timezone = UTC
# truncate slug length
truncate_slug_length = 40

# revision environment
revision_environment = false

# sourceless
sourceless = false

# version locations
# version_locations =

# path separator
path_separator = os

# recursive version locations
recursive_version_locations = false

# output encoding
output_encoding = utf-8

# Database URL – Change this to use environment variable in production
# For now, it's hardcoded to your Neon connection string.
# Better: use `%` substitution and load from .env in env.py


[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S